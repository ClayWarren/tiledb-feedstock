name: TileDB full-feature native Windows ARM64
on:
  push:
    branches: [codex/tiledb-arm64-probe]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: github.repository == 'ClayWarren/tiledb-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        config: [win_arm64_]
    steps:
